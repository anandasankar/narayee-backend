paths:
  /callback-requests:
    post:
      tags:
        - Callback Request
      summary: Create Callback Request
      description: Submits a new callback request. Public endpoint. A conflict is raised if an active (PENDING or SCHEDULED) request already exists for the same mobile number.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - mobileNumber
                - preferredAt
                - enquiryType
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Rahul Verma

                mobileNumber:
                  type: string
                  example: '+919876543210'

                preferredAt:
                  type: string
                  format: date-time
                  description: Must be a future date-time in ISO 8601 format
                  example: '2026-04-15T10:30:00.000Z'

                enquiryType:
                  type: string
                  enum:
                    - ONLINE_COURSE
                    - OFFLINE_COURSE
                    - DEMO_CLASS
                    - CONSULTATION
                    - OTHER
                  example: ONLINE_COURSE

                notes:
                  type: string
                  maxLength: 500
                  example: Interested in the full-stack development course

      responses:
        '201':
          description: Callback request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Callback request created successfully

        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid mobile number format

        '409':
          description: Active callback request already exists for this mobile number
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 409
                  message:
                    type: string
                    example: A callback request with this mobile number is already pending or scheduled

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Something went wrong

    get:
      tags:
        - Callback Request
      summary: Get All Callback Requests
      description: Fetches a paginated and filterable list of all callback requests. Accessible by authenticated admin users only.

      security:
        - cookieAuth: []

      parameters:
        - name: pageNo
          in: query
          required: true
          description: Page number for pagination
          schema:
            type: integer
            example: 1

        - name: limit
          in: query
          required: true
          description: Number of records per page
          schema:
            type: integer
            example: 10

        - name: filter
          in: query
          required: false
          description: >
            JSON stringified filter object. Supported fields:
            `name` (partial match), `mobileNumber`, `enquiryType`, `status`, `preferredAt` (ISO 8601).
          schema:
            type: string
            example: '{"status":"PENDING","enquiryType":"ONLINE_COURSE"}'

      responses:
        '200':
          description: Callback requests fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Callback requests fetched successfully
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        example: 42
                      result:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: clx1234abcd5678efgh
                            name:
                              type: string
                              example: Rahul Verma
                            mobileNumber:
                              type: string
                              example: '+919876543210'
                            preferredAt:
                              type: string
                              format: date-time
                              example: '2026-04-15T10:30:00.000Z'
                            enquiryType:
                              type: string
                              enum:
                                - ONLINE_COURSE
                                - OFFLINE_COURSE
                                - DEMO_CLASS
                                - CONSULTATION
                                - OTHER
                              example: ONLINE_COURSE
                            notes:
                              type: string
                              example: Interested in the full-stack development course
                            status:
                              type: string
                              enum:
                                - PENDING
                                - SCHEDULED
                                - COMPLETED
                                - CANCELLED
                              example: PENDING
                            createdAt:
                              type: string
                              format: date-time
                              example: '2026-03-20T08:00:00.000Z'
                            updatedAt:
                              type: string
                              format: date-time
                              example: '2026-03-20T08:00:00.000Z'

        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid query parameters

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthorized

        '403':
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: Access denied

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Something went wrong

  /callback-requests/{id}:
    get:
      tags:
        - Callback Request
      summary: Get Callback Request By ID
      description: Fetches a single callback request by its ID. Accessible by authenticated admin users only.

      security:
        - cookieAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: CUID of the callback request
          schema:
            type: string
            example: clx1234abcd5678efgh

      responses:
        '200':
          description: Callback request fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Callback request fetched successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clx1234abcd5678efgh
                      name:
                        type: string
                        example: Rahul Verma
                      mobileNumber:
                        type: string
                        example: '+919876543210'
                      preferredAt:
                        type: string
                        format: date-time
                        example: '2026-04-15T10:30:00.000Z'
                      enquiryType:
                        type: string
                        enum:
                          - ONLINE_COURSE
                          - OFFLINE_COURSE
                          - DEMO_CLASS
                          - CONSULTATION
                          - OTHER
                        example: DEMO_CLASS
                      notes:
                        type: string
                        example: Interested in the full-stack development course
                      status:
                        type: string
                        enum:
                          - PENDING
                          - SCHEDULED
                          - COMPLETED
                          - CANCELLED
                        example: PENDING
                      createdAt:
                        type: string
                        format: date-time
                        example: '2026-03-20T08:00:00.000Z'
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2026-03-20T08:00:00.000Z'

        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid callback request id format

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthorized

        '403':
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: Access denied

        '404':
          description: Callback request not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: Callback request not found

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Something went wrong

    delete:
      tags:
        - Callback Request
      summary: Delete Callback Request
      description: Permanently deletes a callback request by ID. Accessible by authenticated admin users only.

      security:
        - cookieAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: CUID of the callback request
          schema:
            type: string
            example: clx1234abcd5678efgh

      responses:
        '200':
          description: Callback request deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Callback request deleted successfully

        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid callback request id format

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthorized

        '403':
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: Access denied

        '404':
          description: Callback request not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: Callback request not found

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Something went wrong

  /callback-requests/{id}/status:
    patch:
      tags:
        - Callback Request
      summary: Update Callback Request Status
      description: Updates the status of a callback request. Admin-only endpoint. Only the `status` field can be changed.

      security:
        - cookieAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: CUID of the callback request
          schema:
            type: string
            example: clx1234abcd5678efgh

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - SCHEDULED
                    - COMPLETED
                    - CANCELLED
                  example: SCHEDULED

      responses:
        '200':
          description: Callback request updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Callback request updated successfully

        '400':
          description: Validation error or invalid ID format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid callback request id format

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: Unauthorized

        '403':
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: Access denied

        '404':
          description: Callback request not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: Callback request not found

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Something went wrong

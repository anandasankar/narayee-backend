paths:
  /career:
    post:
      tags:
        - Career
      summary: Create Career
      description: Creates a new career course. Only admin users can create a career.

      security:
        - cookieAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - shortDescription
                - description
                - duration
                - level
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 100
                  example: Full Stack Web Development

                shortDescription:
                  type: string
                  minLength: 20
                  maxLength: 200
                  example: Learn full stack development with real world projects.

                description:
                  type: string
                  minLength: 100
                  maxLength: 5000
                  example: >
                    This course will teach you complete full stack development
                    including frontend, backend, database, authentication,
                    deployment, and real-world project building.

                duration:
                  type: string
                  enum:
                    - 3 Months
                    - 4 Months
                    - 6 Months
                    - 9 Months
                    - 12 Months
                  example: 6 Months

                level:
                  type: string
                  enum:
                    - BEGINNER
                    - INTERMEDIATE
                    - ADVANCED
                  example: ADVANCED

      responses:
        '201':
          description: Career created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 201

                  message:
                    type: string
                    example: Career created successfully

        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 400

                  message:
                    type: string
                    example: Validation failed

        '401':
          description: Unauthorized (not authenticated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 401

                  message:
                    type: string
                    example: Unauthorized

        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 403

                  message:
                    type: string
                    example: Access denied

        '409':
          description: Career already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 409

                  message:
                    type: string
                    example: Career already exists

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 500

                  message:
                    type: string
                    example: Something went wrong

    get:
      tags:
        - Career
      summary: Get All Careers
      description: Fetch all career courses with pagination and optional filters.

      parameters:
        - in: query
          name: pageNo
          required: false
          schema:
            type: integer
            example: 1
          description: Page number for pagination

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            example: 10
          description: Number of records per page

        - in: query
          name: filter
          required: false
          schema:
            type: string
            example: '{"title":"Web Development","duration":"6 Months","level":"BEGINNER"}'
          description: JSON string filter for career fields

      responses:
        '200':
          description: Careers fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Careers fetched successfully

                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 25

                      pageNo:
                        type: integer
                        example: 1

                      limit:
                        type: integer
                        example: 10

                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: clx8k2j1h0000y7x123abcd45

                            title:
                              type: string
                              example: Full Stack Development

                            shortDescription:
                              type: string
                              example: Learn complete full stack development.

                            description:
                              type: string
                              example: This course covers frontend, backend and deployment.

                            duration:
                              type: string
                              example: 6 Months

                            level:
                              type: string
                              example: Beginner

                            image:
                              type: string
                              nullable: true
                              example: https://example.com/image.png

                            createdAt:
                              type: string
                              format: date-time

                            updatedAt:
                              type: string
                              format: date-time

        '400':
          description: Validation error or empty update request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 400

                  message:
                    type: string
                    example: Validation failed

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 500

                  message:
                    type: string
                    example: Something went wrong

  /career/{id}:
    put:
      tags:
        - Career
      summary: Update Career
      description: Update an existing career course. Only admin users can update a career. At least one field should be provided.

      security:
        - cookieAuth: []

      parameters:
        - in: path
          name: id
          required: true
          description: Career ID (CUID format)
          schema:
            type: string
            example: clx8k2j1h0000y7x123abcd45

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 100
                  example: Advanced Full Stack Development

                shortDescription:
                  type: string
                  minLength: 20
                  maxLength: 200
                  example: Master full stack development with advanced projects.

                description:
                  type: string
                  minLength: 100
                  maxLength: 5000
                  example: >
                    This advanced course focuses on scalable backend architecture,
                    frontend optimization, authentication systems, microservices,
                    and deployment strategies used in real production systems.

                duration:
                  type: string
                  enum:
                    - 3 Months
                    - 4 Months
                    - 6 Months
                    - 9 Months
                    - 12 Months
                  example: 6 Months

                level:
                  type: string
                  enum:
                    - BEGINNER
                    - INTERMEDIATE
                    - ADVANCED
                  example: ADVANCED

      responses:
        '200':
          description: Career updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Career updated successfully

        '400':
          description: Validation error or empty update request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 400

                  message:
                    type: string
                    example: Validation failed

        '401':
          description: Unauthorized (not authenticated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 401

                  message:
                    type: string
                    example: Unauthorized

        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 403

                  message:
                    type: string
                    example: Access denied

        '404':
          description: Career not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 404

                  message:
                    type: string
                    example: Career not found

        '409':
          description: Career title already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 409

                  message:
                    type: string
                    example: Career already exists

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 500

                  message:
                    type: string
                    example: Something went wrong

    get:
      tags:
        - Career
      summary: Get Career By ID
      description: Fetch a single career by its ID.

      parameters:
        - in: path
          name: id
          required: true
          description: Career ID (CUID format)
          schema:
            type: string
            example: clx8k2j1h0000y7x123abcd45

      responses:
        '200':
          description: Career fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Career fetched successfully

                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: clx8k2j1h0000y7x123abcd45

                      title:
                        type: string
                        example: Full Stack Development

                      shortDescription:
                        type: string
                        example: Learn full stack with projects.

                      description:
                        type: string
                        example: Complete training covering frontend and backend.

                      duration:
                        type: string
                        example: 6 Months

                      level:
                        type: string
                        example: Beginner

                      image:
                        type: string
                        nullable: true
                        example: https://example.com/image.png

                      createdAt:
                        type: string
                        format: date-time

                      updatedAt:
                        type: string
                        format: date-time

        '404':
          description: Career not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 404

                  message:
                    type: string
                    example: Career not found

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 500

                  message:
                    type: string
                    example: Something went wrong

    delete:
      tags:
        - Career
      summary: Delete Career
      description: Delete a career course by ID. Only admin users can delete careers.

      security:
        - cookieAuth: []

      parameters:
        - in: path
          name: id
          required: true
          description: Career ID (CUID format)
          schema:
            type: string
            example: clx8k2j1h0000y7x123abcd45

      responses:
        '200':
          description: Career deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  statusCode:
                    type: integer
                    example: 200

                  message:
                    type: string
                    example: Career deleted successfully

        '401':
          description: Unauthorized (not authenticated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 401

                  message:
                    type: string
                    example: Unauthorized

        '403':
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 403

                  message:
                    type: string
                    example: Access denied

        '404':
          description: Career not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 404

                  message:
                    type: string
                    example: Career not found

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  statusCode:
                    type: integer
                    example: 500

                  message:
                    type: string
                    example: Something went wrong

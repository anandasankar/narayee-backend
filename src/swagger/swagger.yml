openapi: 3.0.0

info:
  title: Cord RD Backend API
  description: Production Ready Express API
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development
  - url: https://api.yourdomain.com/api/v1
    description: Production

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

security:
  - cookieAuth: []
